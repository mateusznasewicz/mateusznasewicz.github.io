<section class="stacked-wrapper" id="projects">
    <div class="cards-container">
        
        @for(p of projects; track p.id; let i = $index){
        <div class="project-card">
        
            <div class="card-inner">
                <div class="card-header">
                    <span class="mono number">0{{i + 1}}</span>
                    <span class="mono year">{{p.year}}</span>
                </div>
                
                <div class="card-body">
                <div class="text-content">
                    <a href="{{p.repoUrl}}" target="_blank"><h3>{{p.title}}</h3></a> <p class="role mono">{{p.role}}</p>
                    <p class="desc">{{p.description}}</p>
                    <div class="tags">
                    @for(t of p.techStack; track $index){
                    <span class="tag mono">{{t}}</span>
                    }
                    </div>
                </div>
                
                <div class="visual-content">
                    <div class="img-placeholder" [style.background]="p.hexColor || '#333'">
                    {{p.imageUrl}}
                    </div>
                </div>
                </div>
            </div>

        </div>
        }

    </div>
</section>

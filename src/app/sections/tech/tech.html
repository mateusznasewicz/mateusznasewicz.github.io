<section class="tech-streams-wrapper" id="tech">
    <div class="container-header">
        <h2 class="section-title">TECHNOLOGY <span class="hollow">ECOSYSTEM</span></h2>
    </div>

   <div class="streams-container">
  @for(row of techRows; track $index; let i = $index) {
    <div class="tech-track" [class.reverse]="i % 2 !== 0">
      
      @for(set of [1,2]; track set) {
        @for(item of row; track item.name) {
          <div class="tech-chip">
            <div class="icon-box">
              <i class="{{item.icon}}"></i>
            </div>
            <span class="tech-name">{{item.name}}</span>
          </div>
        }
      }

    </div>
  }
</div>
</section>
